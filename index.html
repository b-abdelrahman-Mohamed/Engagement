:root {
  --night: #1b0810;
  --night-hi: #3a0f1c;
  --wine-lo: #2b0712;
  --gold: #c9a24b;
  --gold-hi: #f1dc98;
  --gold-lo: #8a6420;
  --paper: #f2e9d5;
  --ink: #531623;
  --ink-soft: #7a3d48;

  --display: 'InvAref', 'InvAmiri', 'Geeza Pro', 'Noto Naskh Arabic', 'Traditional Arabic', serif;
  --text: 'InvAmiri', 'Geeza Pro', 'Noto Naskh Arabic', 'Traditional Arabic', 'Times New Roman', serif;

  /* --cw is set from the screen size by the script at the bottom; this is the fallback. */
  --cw: 300px;
  --ew: calc(var(--cw) / .88);
  --eh: calc(var(--ew) * .66);
  --ch: calc(var(--cw) * 1.85);
}

* { -webkit-box-sizing: border-box; box-sizing: border-box; }
html { height: 100%; background-color: #1b0810; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  padding-top: 20px;
  padding-bottom: 20px;
  padding-left: 16px;
  padding-right: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-color: #1b0810;
  background-image: radial-gradient(ellipse 90% 70% at 50% 42%, #3a0f1c 0%, #1b0810 72%);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--gold-hi);
  font-family: var(--text);
  overflow-x: hidden;
}

.stage {
  position: relative;
  -webkit-flex: none;
  flex: none;
  width: var(--ew);
  height: calc(var(--ch) + 24px);
}

.hint {
  position: absolute;
  left: 0;
  width: 100%;
  top: calc(50% + var(--eh) / 2 + 30px);
  text-align: center;
  font-weight: 400;
  font-size: 20px;
  color: var(--gold);
  -webkit-transition: opacity .5s ease;
  transition: opacity .5s ease;
  margin: 0;
}
.cracked .hint { opacity: 0; }

/* ---------- envelope ---------- */
.env {
  position: absolute;
  left: 0;
  top: 50%;
  width: var(--ew);
  height: var(--eh);
  -webkit-transform: translateY(-50%);
  transform: translateY(-50%);
  -webkit-perspective: 1200px;
  perspective: 1200px;
}
.env > * { position: absolute; }

.back {
  top: 0; right: 0; bottom: 0; left: 0;
  z-index: 0;
  background: linear-gradient(180deg, #230510, #2b0712);
  -webkit-transition: opacity .8s ease .25s;
  transition: opacity .8s ease .25s;
}
.pocket {
  top: 0; right: 0; bottom: 0; left: 0;
  z-index: 3;
  -webkit-transition: opacity .8s ease .25s;
  transition: opacity .8s ease .25s;
}
.pocket svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  -webkit-filter: drop-shadow(0 -2px 4px rgba(0, 0, 0, .35));
  filter: drop-shadow(0 -2px 4px rgba(0, 0, 0, .35));
}
.pocket .pl { fill: #56152b; }
.pocket .pr { fill: #480f22; }
.pocket .pb { fill: #62192f; }
.pocket polygon { stroke: rgba(255, 225, 205, .1); stroke-width: 1; vector-effect: non-scaling-stroke; }
.grain {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  -webkit-clip-path: polygon(0 0, 50% 54.5%, 100% 0, 100% 100%, 0 100%);
  clip-path: polygon(0 0, 50% 54.5%, 100% 0, 100% 100%, 0 100%);
  background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxNjAnIGhlaWdodD0nMTYwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nLjg1JyBudW1PY3RhdmVzPScyJyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PGZlQ29sb3JNYXRyaXggdmFsdWVzPScwIDAgMCAwIC45ICAwIDAgMCAwIC42ICAwIDAgMCAwIC41ICAwIDAgMCAuMiAwJy8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9JzEwMCUnIGhlaWdodD0nMTAwJScgZmlsdGVyPSd1cmwoI24pJy8+PC9zdmc+");
  opacity: .55;
  pointer-events: none;
}

.flap {
  left: 0;
  top: 0;
  width: 100%;
  height: 59%;
  z-index: 4;
  -webkit-transition: z-index 0s .45s;
  transition: z-index 0s .45s;
}
.open .flap {
  z-index: 1;
  -webkit-transition: z-index 0s .35s;
  transition: z-index 0s .35s;
}
/* The flap folds about its top edge: the outside face shrinks to a line, then the inside face grows upward. */
.flap svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  -webkit-transform-origin: 50% 0;
  transform-origin: 50% 0;
}
.flap .out-face {
  -webkit-transform: scaleY(1);
  transform: scaleY(1);
  -webkit-transition: -webkit-transform .35s cubic-bezier(.45, 0, 1, 1) .45s, opacity .8s ease .25s;
  transition: transform .35s cubic-bezier(.45, 0, 1, 1) .45s, opacity .8s ease .25s;
}
.open .flap .out-face {
  -webkit-transform: scaleY(0);
  transform: scaleY(0);
  -webkit-transition: -webkit-transform .35s cubic-bezier(.45, 0, 1, 1), opacity .8s ease .25s;
  transition: transform .35s cubic-bezier(.45, 0, 1, 1), opacity .8s ease .25s;
}
.flap .in {
  -webkit-transform: scaleY(0);
  transform: scaleY(0);
  -webkit-transition: -webkit-transform .45s cubic-bezier(.3, 0, .2, 1), opacity .8s ease .25s;
  transition: transform .45s cubic-bezier(.3, 0, .2, 1), opacity .8s ease .25s;
}
.open .flap .in {
  -webkit-transform: scaleY(-1);
  transform: scaleY(-1);
  -webkit-transition: -webkit-transform .45s cubic-bezier(0, 0, .2, 1) .35s, opacity .8s ease .25s;
  transition: transform .45s cubic-bezier(0, 0, .2, 1) .35s, opacity .8s ease .25s;
}

  var busy = false, isOpen = false;
  function later(fn, ms) { setTimeout(fn, reduce ? 0 : ms); }
  function add(c) { stage.className = stage.className + ' ' + c; }
  function rem(c) { stage.className = (' ' + stage.className + ' ').split(' ' + c + ' ').join(' ').replace(/^\s+|\s+$/g, ''); }

  function openIt() {
    if (busy || isOpen) return;
    busy = true;
    if (seal.blur) seal.blur();
    add('cracked');
    later(function () { add('open'); }, 550);
    later(function () { add('rise'); }, 1400);
    later(function () {
      add('out');
      card.setAttribute('aria-hidden', 'false');
      isOpen = true;
      busy = false;
    }, 2400);
  }
  function closeIt() {
    if (busy || !isOpen) return;
    busy = true;
    rem('out');
    card.setAttribute('aria-hidden', 'true');
    later(function () { rem('rise'); }, 900);
    later(function () { rem('open'); }, 1800);
    later(function () { rem('cracked'); isOpen = false; busy = false; }, 2800);
  }
  seal.addEventListener('click', openIt);
  again.addEventListener('click', closeIt);
})();
</script>
